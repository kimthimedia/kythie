<title>Kythie – Hôm nay tui ăn gì?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{--bg:#f4edff;--card:#ffffff;--ink:#2a1650;--pri:#7b4bd1;--pri2:#5f33b0;--soft:#ebe0ff;--mid:#cdb6f5;--mut:#65558a;--onpri:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1430;--card:#2a1f45;--ink:#f3eaff;--pri:#b794f6;--pri2:#cdb6f5;--soft:#3a2d5c;--mid:#5b4690;--mut:#bba9dd;--onpri:#22123f}}
:root[data-theme="dark"]{--bg:#1c1430;--card:#2a1f45;--ink:#f3eaff;--pri:#b794f6;--pri2:#cdb6f5;--soft:#3a2d5c;--mid:#5b4690;--mut:#bba9dd;--onpri:#22123f}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.4}
main{max-width:520px;margin:0 auto;padding:14px 16px 40px}
.top{display:flex;align-items:center;gap:12px}
.top svg{width:84px;height:84px;flex:none}
.brand{font-weight:800;font-size:30px;color:var(--pri2);line-height:1}
.sub{color:var(--mut);font-size:15px}
.q{display:flex;gap:8px;align-items:center;margin:10px 0 6px}
.q input{flex:1;min-width:0;font:800 24px/1.2 inherit;font-family:inherit;color:var(--ink);background:transparent;border:2px dashed transparent;border-radius:14px;padding:6px 10px;text-align:center}
.q input:hover{border-color:var(--mid)}
.q input:focus{outline:none;border:2px solid var(--pri);background:var(--card)}
.ic{flex:none;width:42px;height:42px;border-radius:50%;border:2px solid var(--mid);background:var(--card);color:var(--pri2);font-size:18px;cursor:pointer}
.ic:focus-visible,button:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.wheelbox{position:relative;width:min(100%,400px);margin:6px auto 0}
canvas{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 18px rgba(123,75,209,.28))}
.ptr{position:absolute;top:-6px;left:50%;width:0;height:0;margin-left:-16px;border-left:16px solid transparent;border-right:16px solid transparent;border-top:34px solid var(--pri2);filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.go{display:block;margin:14px auto 0;font:800 24px inherit;font-family:inherit;padding:10px 44px;border:0;border-radius:999px;background:var(--pri);color:var(--onpri);cursor:pointer;box-shadow:0 5px 0 var(--pri2)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pri2)}
.go:disabled{opacity:.6}
.card{background:var(--card);border:2px solid var(--soft);border-radius:22px;padding:14px 16px;margin-top:16px}
.res{text-align:center}
.pick{font-weight:800;font-size:30px;color:var(--pri2)}
.dish{border-top:2px dashed var(--soft);padding:10px 0;text-align:left}
.dish:first-of-type{border-top:0}
.dn{font-weight:700;font-size:19px}
.tag{display:inline-block;margin:3px 4px 0 0;padding:1px 10px;border-radius:999px;font-size:14px;background:var(--soft);color:var(--ink)}
.tag.no{background:transparent;border:1.5px dashed var(--mid);color:var(--mut)}
h2{margin:0 0 8px;font-size:20px;color:var(--pri2)}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;font:500 17px inherit;font-family:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--mid);border-radius:14px;padding:8px 12px}
.add input:focus{outline:3px solid var(--pri);outline-offset:1px}
.btn{font:700 16px inherit;font-family:inherit;border:0;border-radius:14px;padding:8px 16px;background:var(--pri);color:var(--onpri);cursor:pointer}
.btn.alt{background:var(--soft);color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;margin:10px 0 6px;color:var(--mut);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:260px;overflow:auto}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--soft);color:var(--ink);border-radius:999px;padding:2px 4px 2px 12px;font-size:16px}
.chip button{width:24px;height:24px;border:0;border-radius:50%;background:var(--card);color:var(--pri2);font-weight:800;cursor:pointer;line-height:1}
.msg{min-height:22px;color:var(--pri2);font-size:15px;margin-top:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="top">
    <svg viewBox="0 0 120 120" role="img" aria-label="Kythie – rùa đội mũ đầu bếp">
      <ellipse cx="60" cy="112" rx="34" ry="5" fill="#cdb6f5" opacity=".6"/>
      <ellipse cx="30" cy="102" rx="12" ry="9" fill="#8fd18a"/><ellipse cx="90" cy="102" rx="12" ry="9" fill="#8fd18a"/>

      <circle cx="60" cy="62" r="23" fill="#9bdb94"/>
      <circle cx="51" cy="64" r="3.4" fill="#2a1650"/><circle cx="69" cy="64" r="3.4" fill="#2a1650"/>
      <circle cx="52" cy="63" r="1" fill="#fff"/><circle cx="70" cy="63" r="1" fill="#fff"/>
      <circle cx="43" cy="72" r="4.5" fill="#ffb3c7" opacity=".8"/><circle cx="77" cy="72" r="4.5" fill="#ffb3c7" opacity=".8"/>
      <path d="M54 72q6 6 12 0" stroke="#2a1650" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <g fill="#fff" stroke="#bda4ee" stroke-width="2"><circle cx="45" cy="29" r="11"/><circle cx="75" cy="29" r="11"/><circle cx="60" cy="22" r="13"/><rect x="42" y="32" width="36" height="14" rx="5"/></g>
      <path d="M42 41h36" stroke="#e3d6fb" stroke-width="2"/>
    </svg>
    <div><div class="brand">Kythie</div><div class="sub">Quay một vòng, nấu một món</div></div>
    <span style="flex:1"></span>
    <button class="ic" id="snd" title="Bật/tắt âm thanh" aria-label="Bật/tắt âm thanh">🔊</button>
  </div>

  <div class="q">
    <input id="q" maxlength="60" aria-label="Câu hỏi của vòng quay" value="Hôm nay tui ăn gì?">
    <button class="ic" id="eq" title="Sửa câu hỏi" aria-label="Sửa câu hỏi">✏️</button>
  </div>

  <div class="wheelbox"><div class="ptr"></div><canvas id="w" width="800" height="800" aria-label="Vòng quay nguyên liệu"></canvas></div>
  <button class="go" id="go">QUAY!</button>

  <section class="card res" id="res" aria-live="polite"><div class="sub">Bấm QUAY để Kythie chọn nguyên liệu và gợi ý món cho bạn.</div></section>

  <section class="card">
    <h2>Nguyên liệu của bạn</h2>
    <div class="add"><input id="in" placeholder="Nhập nguyên liệu (có thể ngăn bằng dấu phẩy)" aria-label="Thêm nguyên liệu"><button class="btn" id="ad">Thêm</button></div>
    <div class="msg" id="msg"></div>
    <div class="row"><span id="cnt"></span><button class="btn alt" id="clr">Xóa hết</button></div>
    <div class="chips" id="chips"></div>
  </section>
</main>

<script>
const $=s=>document.querySelector(s), MAX=100;
const DEF=["Trứng","Cơm","Thịt heo","Gà","Cà chua","Hành lá","Mì gói","Rau muống","Đậu hũ","Tôm","Bún","Khoai tây"];
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase().trim().replace(/\s+/g,' ');
const has=(a,b)=>(' '+a+' ').includes(' '+b+' ');
const DISH=[
["Cơm chiên trứng",["cơm","trứng","hành"]],["Trứng chiên cà chua",["trứng","cà chua"]],["Canh cà chua trứng",["cà chua","trứng","hành"]],
["Mì xào trứng rau",["mì","trứng","rau"]],["Mì trứng ốp la",["mì","trứng"]],["Bánh mì ốp la",["bánh mì","trứng"]],["Sandwich trứng phô mai",["bánh mì","trứng","phô mai"]],
["Gà xào sả ớt",["gà","sả","ớt"]],["Gà kho gừng",["gà","gừng"]],["Cháo gà",["gạo","gà","gừng"]],["Phở gà",["phở","gà","hành"]],["Gà nấu cà ri",["gà","khoai tây","cà rốt","cà ri"]],
["Thịt kho trứng",["thịt heo","trứng"]],["Thịt heo xào rau muống",["thịt heo","rau muống","tỏi"]],["Rau muống xào tỏi",["rau muống","tỏi"]],["Cơm tấm sườn",["cơm","sườn","trứng"]],
["Đậu hũ sốt cà",["đậu hũ","cà chua","hành"]],["Đậu hũ chiên sả",["đậu hũ","sả","ớt"]],["Đậu hũ nhồi thịt",["đậu hũ","thịt heo","hành"]],
["Tôm rim mặn ngọt",["tôm","hành"]],["Canh bí đao nấu tôm",["bí đao","tôm"]],["Mì xào hải sản",["mì","tôm","mực"]],
["Bún thịt nướng",["bún","thịt heo","dưa leo","rau thơm"]],["Bún riêu",["bún","cà chua","cua"]],["Hủ tiếu",["hủ tiếu","thịt heo","tôm"]],
["Khoai tây chiên",["khoai tây"]],["Khoai tây hầm thịt",["khoai tây","thịt heo","cà rốt"]],["Salad rau củ",["xà lách","cà chua","dưa leo"]],
["Nấm xào tỏi",["nấm","tỏi"]],["Bò xào hành tây",["bò","hành tây"]],["Bò lúc lắc",["bò","ớt chuông","hành tây"]],["Mì Ý sốt bò bằm",["mì ý","bò","cà chua"]],
["Mì gói thêm trứng rau",["mì gói","trứng","rau"]],["Cá hồi áp chảo",["cá hồi","chanh"]],["Canh chua cá thu",["cá thu","cà chua","thơm"]]
].map(([n,k])=>({n,k:k.map(x=>[x,norm(x)])}));

let items=[],mute=false,rot=0,spinning=false;
try{items=JSON.parse(localStorage.getItem('ky_items')||'[]');mute=localStorage.getItem('ky_mute')==='1';const q=localStorage.getItem('ky_q');if(q)$('#q').value=q}catch(e){}
if(!Array.isArray(items)||!items.length)items=DEF.slice();
items=items.slice(0,MAX);
const save=()=>{try{localStorage.setItem('ky_items',JSON.stringify(items))}catch(e){}};

/* ---------- sfx ---------- */
let AC;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function beep(f,d,t,v,at){if(mute)return;const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain(),s=c.currentTime+(at||0);o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.12,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+d)}
const tick=()=>beep(520+Math.random()*120,.05,'triangle',.1);
const win=()=>[523,659,784,1047].forEach((f,i)=>beep(f,.3,'triangle',.15,i*.1));

/* ---------- wheel ---------- */
const cv=$('#w'),cx=cv.getContext('2d'),R=400;
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function draw(){
  const n=items.length,seg=2*Math.PI/n,dark=matchMedia('(prefers-color-scheme:dark)').matches&&document.documentElement.dataset.theme!=='light'||document.documentElement.dataset.theme==='dark';
  cx.clearRect(0,0,800,800);
  for(let i=0;i<n;i++){
    const a=rot+i*seg,h=255+((i*37)%40)-10,l=dark?(38+(i%3)*7):(80+(i%3)*6);
    cx.beginPath();cx.moveTo(R,R);cx.arc(R,R,R-8,a,a+seg);cx.closePath();
    cx.fillStyle=`hsl(${h},${dark?45:70}%,${l}%)`;cx.fill();
    cx.strokeStyle=dark?'#1c1430':'#fff';cx.lineWidth=n>40?1:3;cx.stroke();
    if(n<=30){
      cx.save();cx.translate(R,R);cx.rotate(a+seg/2);cx.textAlign='right';cx.textBaseline='middle';
      cx.fillStyle=dark?'#f3eaff':'#2a1650';cx.font=`700 ${Math.max(18,Math.min(34,Math.floor(R*seg*.55)))}px "Baloo 2",sans-serif`;
      let t=items[i];if(t.length>12)t=t.slice(0,11)+'…';cx.fillText(t,R-36,0);cx.restore();
    }
  }
  cx.beginPath();cx.arc(R,R,R-8,0,7);cx.lineWidth=8;cx.strokeStyle=dark?'#b794f6':'#7b4bd1';cx.stroke();
  cx.beginPath();cx.arc(R,R,46,0,7);cx.fillStyle=dark?'#2a1f45':'#fff';cx.fill();cx.lineWidth=6;cx.strokeStyle=dark?'#b794f6':'#7b4bd1';cx.stroke();
  cx.font='42px sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('🍽️',R,R+3);
}
const idxAt=r=>{const n=items.length,s=2*Math.PI/n;let a=(-Math.PI/2-r)%(2*Math.PI);if(a<0)a+=2*Math.PI;return Math.floor(a/s)%n};

function spin(){
  if(spinning)return;
  if(items.length<2){$('#msg').textContent='Cần ít nhất 2 nguyên liệu để quay nhé.';return}
  ac();spinning=true;$('#go').disabled=true;
  beep(260,.25,'sawtooth',.05);
  const start=rot,total=(6+Math.random()*3)*2*Math.PI+Math.random()*2*Math.PI,dur=4800,t0=performance.now();
  let last=idxAt(rot),lastT=0;
  (function f(now){
    const t=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-t,3.2);
    rot=start+total*e;draw();
    const i=idxAt(rot);if(i!==last){last=i;if(now-lastT>28){tick();lastT=now}}
    if(t<1)requestAnimationFrame(f);else{spinning=false;$('#go').disabled=false;win();show(items[idxAt(rot)])}
  })(t0);
}

/* ---------- result ---------- */
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function show(name){
  const nn=norm(name),pool=items.map(norm);
  const rows=DISH.filter(d=>d.k.some(([,k])=>has(nn,k))).map(d=>{
    const k=d.k.map(([x,nk])=>({x,ok:pool.some(p=>has(p,nk))}));
    return{d,k,n:k.filter(z=>z.ok).length}
  }).sort((a,b)=>b.n/b.k.length-a.n/a.k.length||b.n-a.n).slice(0,3);
  let h=`<div class="sub">Nguyên liệu được chọn</div><div class="pick">${esc(name)}</div>`;
  if(rows.length){
    h+=`<div class="sub" style="margin:6px 0 4px">Kythie gợi ý bạn nấu:</div>`;
    h+=rows.map(r=>`<div class="dish"><div class="dn">${esc(r.d.n)} <span class="sub">(${r.n}/${r.k.length} nguyên liệu)</span></div>${r.k.map(z=>`<span class="tag ${z.ok?'':'no'}">${z.ok?'✓':'+'} ${esc(z.x)}</span>`).join('')}</div>`).join('');
    h+=`<div class="sub" style="margin-top:6px">✓ đã có trong danh sách · + còn thiếu</div>`;
  }else{
    const e=esc(name);
    h+=`<div class="sub" style="margin:6px 0 4px">Chưa có công thức mẫu, thử các kiểu này nhé:</div>`+[`${e} xào tỏi`,`${e} nấu canh`,`${e} chiên giòn`,`${e} hấp`].map(x=>`<span class="tag">${x}</span>`).join('');
  }
  $('#res').innerHTML=h;
}

/* ---------- ingredient list ---------- */
function render(){
  $('#cnt').textContent=`${items.length}/${MAX} nguyên liệu`;
  $('#chips').innerHTML=items.map((t,i)=>`<span class="chip">${esc(t)}<button data-i="${i}" aria-label="Xóa ${esc(t)}">×</button></span>`).join('')||'<span class="sub">Chưa có nguyên liệu nào. Hãy thêm vài món nhé!</span>';
  draw();save();
}
function add(){
  const raw=$('#in').value.split(/[,\n;]/).map(s=>s.trim()).filter(Boolean);
  let added=0,dup=0,full=false;
  for(const t of raw){
    if(items.length>=MAX){full=true;break}
    if(items.some(x=>norm(x)===norm(t))){dup++;continue}
    items.push(t.slice(0,30));added++;
  }
  $('#in').value='';
  $('#msg').textContent=full?`Đã đủ ${MAX} nguyên liệu, hãy xóa bớt trước khi thêm.`:added?`Đã thêm ${added} nguyên liệu.`+(dup?` ${dup} món bị trùng nên bỏ qua.`:''):dup?'Nguyên liệu này đã có rồi.':'';
  render();$('#in').focus();
}
$('#ad').onclick=add;
$('#in').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add()}});
$('#chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;items.splice(+b.dataset.i,1);$('#msg').textContent='';render()};
let armed=false;
$('#clr').onclick=function(){
  if(!armed){armed=true;this.textContent='Bấm lần nữa để xóa';setTimeout(()=>{armed=false;this.textContent='Xóa hết'},2500);return}
  armed=false;this.textContent='Xóa hết';items=[];$('#msg').textContent='Danh sách đang trống, hãy thêm nguyên liệu mới.';render();
};
$('#go').onclick=spin;

/* ---------- question + sound toggle ---------- */
$('#eq').onclick=()=>{$('#q').focus();$('#q').select()};
$('#q').addEventListener('input',()=>{try{localStorage.setItem('ky_q',$('#q').value)}catch(e){}});
$('#snd').onclick=()=>{mute=!mute;$('#snd').textContent=mute?'🔇':'🔊';try{localStorage.setItem('ky_mute',mute?'1':'0')}catch(e){}if(!mute){ac();tick()}};
$('#snd').textContent=mute?'🔇':'🔊';
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',draw);
(document.fonts&&document.fonts.ready||Promise.resolve()).then(draw);
render();
</script>
</body>
</html>
